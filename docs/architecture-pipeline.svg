<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#121824"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffcc"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="neonRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055"/>
      <stop offset="100%" stop-color="#ff5500"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2c974"/>
      <stop offset="100%" stop-color="#c4a76c"/>
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1100" height="520" rx="16" fill="url(#bgGrad)" stroke="#1f293d" stroke-width="2"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.08" stroke="#00ffcc" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="520"/>
    <line x1="250" y1="0" x2="250" y2="520"/>
    <line x1="450" y1="0" x2="450" y2="520"/>
    <line x1="700" y1="0" x2="700" y2="520"/>
    <line x1="900" y1="0" x2="900" y2="520"/>
    <line x1="0" y1="130" x2="1100" y2="130"/>
    <line x1="0" y1="260" x2="1100" y2="260"/>
    <line x1="0" y1="390" x2="1100" y2="390"/>
  </g>

  <!-- Title & Kicker -->
  <text x="40" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#00ffcc" letter-spacing="3">ENTERPRISE PIPELINE ARCHITECTURE</text>
  <text x="40" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="0.5">AntiGravity 2.1 — Zero-Trust Dual-Agent Security Pipeline</text>

  <!-- Flow Arrows / Connectors -->
  <!-- 1 -> 2 -->
  <path d="M 220 230 L 290 230" stroke="#00ffcc" stroke-width="2.5" stroke-dasharray="5,4" fill="none" opacity="0.8"/>
  <polygon points="295,230 286,225 286,235" fill="#00ffcc"/>

  <!-- 2 -> 3 -->
  <path d="M 480 230 L 540 230" stroke="#00ffcc" stroke-width="2.5" stroke-dasharray="5,4" fill="none" opacity="0.8"/>
  <polygon points="545,230 536,225 536,235" fill="#00ffcc"/>

  <!-- 3 -> 4 (top path: SOC Dashboard) -->
  <path d="M 740 200 C 790 200, 810 160, 840 160" stroke="#c4a76c" stroke-width="2.5" fill="none"/>
  <polygon points="845,160 836,155 836,165" fill="#c4a76c"/>

  <!-- 3 -> 5 (bottom path: Incident Webhooks) -->
  <path d="M 740 260 C 790 260, 810 320, 840 320" stroke="#ff0055" stroke-width="2.5" fill="none"/>
  <polygon points="845,320 836,315 836,325" fill="#ff0055"/>

  <!-- NODE 1: Browser Extension (Client) -->
  <g transform="translate(40, 140)">
    <rect width="180" height="200" rx="12" fill="#151b27" stroke="#253248" stroke-width="1.5"/>
    <rect width="180" height="34" rx="12" fill="#1b2333"/>
    <text x="14" y="22" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#00ffcc">CHROME AGENT</text>
    
    <text x="14" y="60" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">DOM Inspection</text>
    <text x="14" y="78" font-family="-apple-system, sans-serif" font-size="10.5" fill="#8b9bb4">• MutationObserver Trap</text>
    <text x="14" y="94" font-family="-apple-system, sans-serif" font-size="10.5" fill="#8b9bb4">• Favicon Logo Extractor</text>
    <text x="14" y="110" font-family="-apple-system, sans-serif" font-size="10.5" fill="#8b9bb4">• Credential Harvester Trap</text>
    
    <rect x="14" y="130" width="152" height="52" rx="6" fill="#0d111a" stroke="#253248"/>
    <text x="24" y="150" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#c4a76c">Enforcement Shield</text>
    <text x="24" y="168" font-family="monospace" font-size="9.5" fill="#8b9bb4">&lt; 50ms Hard Lock</text>
  </g>

  <!-- NODE 2: FastAPI Gatekeeper -->
  <g transform="translate(300, 140)">
    <rect width="180" height="200" rx="12" fill="#151b27" stroke="#00ffcc" stroke-width="1.5" filter="url(#glowCyan)"/>
    <rect width="180" height="34" rx="12" fill="#1b2333"/>
    <text x="14" y="22" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#00ffcc">FASTAPI GATEKEEPER</text>
    
    <text x="14" y="60" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Zero-Trust Analysis</text>
    <text x="14" y="78" font-family="-apple-system, sans-serif" font-size="10.5" fill="#8b9bb4">• POST /analyze (async)</text>
    <text x="14" y="94" font-family="-apple-system, sans-serif" font-size="10.5" fill="#8b9bb4">• IDN Punycode Scanner</text>
    <text x="14" y="110" font-family="-apple-system, sans-serif" font-size="10.5" fill="#8b9bb4">• OSINT Reputation Cache</text>
    
    <rect x="14" y="130" width="152" height="52" rx="6" fill="#0d111a" stroke="#253248"/>
    <text x="24" y="150" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#00ffcc">Decision Hierarchy</text>
    <text x="24" y="168" font-family="monospace" font-size="9.5" fill="#8b9bb4">ALLOW / BLOCK / WARN</text>
  </g>

  <!-- NODE 3: AI Engine & Computer Vision -->
  <g transform="translate(550, 120)">
    <rect width="190" height="240" rx="12" fill="#151b27" stroke="#253248" stroke-width="1.5"/>
    <rect width="190" height="34" rx="12" fill="#1b2333"/>
    <text x="14" y="22" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#06b6d4">DUAL-ENGINE CORE</text>
    
    <text x="14" y="58" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">22-Feature Extractor</text>
    <text x="14" y="74" font-family="-apple-system, sans-serif" font-size="10.5" fill="#8b9bb4">• Shannon Entropy</text>
    <text x="14" y="90" font-family="-apple-system, sans-serif" font-size="10.5" fill="#8b9bb4">• Random Forest (98.65%)</text>
    
    <line x1="14" y1="104" x2="176" y2="104" stroke="#253248"/>

    <text x="14" y="124" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Visual Computer Vision</text>
    <text x="14" y="140" font-family="-apple-system, sans-serif" font-size="10.5" fill="#8b9bb4">• 64-bit Perceptual dHash</text>
    <text x="14" y="156" font-family="-apple-system, sans-serif" font-size="10.5" fill="#8b9bb4">• Hamming Distance Clones</text>
    
    <rect x="14" y="174" width="162" height="50" rx="6" fill="#0d111a" stroke="#253248"/>
    <text x="24" y="193" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#c4a76c">Forensic Evidence DB</text>
    <text x="24" y="210" font-family="monospace" font-size="9.5" fill="#8b9bb4">SQLite + SHA-256 Digest</text>
  </g>

  <!-- NODE 4: SOC Dashboard & 3D Globe -->
  <g transform="translate(850, 80)">
    <rect width="210" height="145" rx="12" fill="#151b27" stroke="#c4a76c" stroke-width="1.5"/>
    <rect width="210" height="34" rx="12" fill="#1b2333"/>
    <text x="14" y="22" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#c4a76c">SOC INTELLIGENCE CONSOLE</text>
    
    <text x="14" y="60" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">3D Threat Radar Globe</text>
    <text x="14" y="78" font-family="-apple-system, sans-serif" font-size="10.5" fill="#8b9bb4">• Native WebSocket (/ws/logs)</text>
    <text x="14" y="94" font-family="-apple-system, sans-serif" font-size="10.5" fill="#8b9bb4">• DEFCON Threat Level Banner</text>
    <text x="14" y="110" font-family="-apple-system, sans-serif" font-size="10.5" fill="#8b9bb4">• Bilingual EN / TR Switcher</text>
  </g>

  <!-- NODE 5: Real-Time Webhook Alerting -->
  <g transform="translate(850, 260)">
    <rect width="210" height="145" rx="12" fill="#151b27" stroke="#ff0055" stroke-width="1.5"/>
    <rect width="210" height="34" rx="12" fill="#1b2333"/>
    <text x="14" y="22" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#ff0055">INCIDENT WEBHOOKS</text>
    
    <text x="14" y="60" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Instant SOC Notification</text>
    <text x="14" y="78" font-family="-apple-system, sans-serif" font-size="10.5" fill="#8b9bb4">• Discord Rich Embeds</text>
    <text x="14" y="94" font-family="-apple-system, sans-serif" font-size="10.5" fill="#8b9bb4">• Slack Incident Blocks</text>
    <text x="14" y="110" font-family="-apple-system, sans-serif" font-size="10.5" fill="#8b9bb4">• Telegram Bot Broadcast</text>
  </g>

  <!-- Bottom Legend / Badges -->
  <g transform="translate(40, 460)">
    <text x="0" y="20" font-family="monospace" font-size="11" fill="#8b9bb4">LATENCY: &lt; 40ms | ROC-AUC: 0.9996 | ACCURACY: 98.65% | DOCKER READY | MITRE ATT&amp;CK MAPPED</text>
  </g>
</svg>
